name: DevSecOps Security Delivery Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  issues: write

jobs:

  security-scan:
    name: Software Supply Chain Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install Node Dependencies
        run: npm install

      - name: Snyk Security Scan
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high

      - name: OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: "TaskMaster-API"
          path: "."
          format: "HTML"
          out: "dependency-check-report"

      - name: Upload Dependency-Check Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-check-report
          path: dependency-check-report/

  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    needs: security-scan

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker compose build

      - name: Start Application
        run: docker compose up -d

      - name: Wait for Application
        run: |
          for i in {1..15}; do
            if curl -fsS http://localhost:8080; then
              echo "Application is ready."
              exit 0
            fi
            echo "Waiting for application..."
            sleep 2
          done
          echo "Application did not become ready."
          docker compose logs
          exit 1

      - name: Test Application
        run: curl -fsS http://localhost:8080

      - name: Stop Application
        if: always()
        run: docker compose down

  dast:
    name: DAST Runtime Verification
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Start Application
        run: docker compose up -d --build

      - name: Wait for Application
        run: |
          for i in {1..15}; do
            if curl -fsS http://localhost:8080; then
              echo "Application is ready."
              exit 0
            fi
            echo "Waiting for application..."
            sleep 2
          done
          echo "Application did not become ready."
          docker compose logs
          exit 1

      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: "http://localhost:8080"

      - name: Stop Application
        if: always()
        run: docker compose down
