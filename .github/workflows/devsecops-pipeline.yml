name: DevSecOps Security Delivery Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  security-scan:
    name: Software Supply Chain Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Node dependencies
        run: npm install

      - name: Run npm audit
        run: npm audit --audit-level=high

      - name: Run Snyk Security Scan
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high

      - name: Run OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'Taskmaster-API'
          path: '.'
          format: 'HTML'
          args: >
            --scan .
            --failOnCVSS 7

      - name: Upload Dependency Check Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: reports

  build-and-test:
    name: Build and Test
    needs: security-scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker images
        run: docker compose build

      - name: Start application
        run: docker compose up -d

      - name: Wait for application
        run: |
          for i in {1..15}; do
            if curl -fsS http://localhost:8080; then
              echo "Application is ready."
              exit 0
            fi
            echo "Waiting for application..."
            sleep 2
          done
          echo "Application did not become ready."
          docker compose logs
          exit 1

      - name: Test application
        run: curl --fail http://localhost:8080

      - name: Stop application
        if: always()
        run: docker compose down

  dast:
    name: DAST Runtime Verification
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start application
        run: docker compose up -d --build

      - name: Wait for application
        run: |
          for i in {1..15}; do
            if curl -fsS http://localhost:8080; then
              echo "Application is ready."
              exit 0
            fi
            echo "Waiting for application..."
            sleep 2
          done
          echo "Application did not become ready."
          docker compose logs
          exit 1

      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'http://localhost:8080'

      - name: Stop application
        if: always()
        run: docker compose down
